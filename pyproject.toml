[project]
name = "hussam-nextgen"
version = "1.30.0"
description = "Hussam Yemeni Sovereign Platform NextGen operational HUS compiler and AI control plane"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0","fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "pydantic>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
